name: 'Lanzou Cloud Upload'
description: '上传文件到蓝奏云网盘，可用于为 中国大陆用户 提供 Release 发布、构建产物上传'
author: '1299172402'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  phpdisk_info:
    description: '蓝奏云登录 Cookie 中的 phpdisk_info 值'
    required: true
  folder_id:
    description: '目标文件夹 ID'
    required: true
  file_path:
    description: '要上传的文件路径（支持 glob 模式，如 dist/*.zip）'
    required: true
  file_name:
    description: '上传后显示的文件名（可选，默认使用原文件名）'
    required: false

outputs:
  uploaded_status:
    description: '上传状态，success 表示全部成功，partial 表示部分成功'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip' # caching pip dependencies
      
    - name: Install dependencies
      run: pip install -r requirements.txt
      shell: bash

    - name: Upload to Lanzou Cloud
      run: python main.py
      shell: bash
      env:
        INPUT_PHPDISK_INFO: ${{ inputs.phpdisk_info }}
        INPUT_FOLDER_ID: ${{ inputs.folder_id }}
        INPUT_FILE_PATH: ${{ inputs.file_path }}
        INPUT_FILE_NAME: ${{ inputs.file_name }}
